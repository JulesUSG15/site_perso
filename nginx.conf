server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    location ~ /\. { deny all; }
    location ~ ^/(icon|apple-icon|opengraph-image|twitter-image)$ {
        default_type image/png;
        try_files $uri =404;
    }
    location ~ ^/(2048|Bdanse|Compil|Dac|GTSRB|Info|IsiWeb|MNIST|MisoMania|PersoWeb|Polycars|Processor|Snake|Sudoku|Vin|about)\.html$ {
        return 301 /;
    }
    if ($request_uri ~ "^/index\.html(?:\?|$)") { return 301 /; }
    location / { try_files $uri $uri/ =404; }
}
